[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-core"
version = "0.1.0a0"
description = "Experimental Lorentz-hyperboloid active-inference research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LeoLordin" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["clean_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
